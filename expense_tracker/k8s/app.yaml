apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-app
  namespace: expense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-app
  template:
    metadata:
      labels:
        app: expense-app
    spec:
      containers:
        - name: app
          image: mdsajidali/expense-tracker:1.1  # Ensure this image is correct
          ports:
            - containerPort: 8000
              hostPort: 8000  # Exposing app on port 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: DJANGO_SECRET_KEY
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DB_NAME
              value: expense
            - name: DB_USER
              value: expense
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-secret
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"

