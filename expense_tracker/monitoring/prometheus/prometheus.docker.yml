global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Prometheus itself (local container)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- Node Exporter (host metrics)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['192.168.74.130:9100']

  # --- cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['192.168.74.130:8080']

  # --- Blackbox Exporter (MicroShift expense-tracker app endpoint)
  - job_name: 'microshift-expense-tracker'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://192.168.74.130:31883  # Expense Tracker NodePort
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.74.130:9115   # ✅ use host IP, not host.docker.internal

  # --- MicroShift Prometheus (inside cluster)
  - job_name: 'microshift-prometheus'
    static_configs:
      - targets: ['192.168.74.130:30187']  # MicroShift Prometheus NodePort

  # --- MicroShift Grafana (inside cluster)
  - job_name: 'microshift-grafana'
    static_configs:
      - targets: ['192.168.74.130:31398']  # MicroShift Grafana NodePort

