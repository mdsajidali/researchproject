{% extends 'expenses/base.html' %}

{% block title %}Sign up{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <h1 class="page-title">Create an account</h1>
        <p class="page-subtitle">
            A small, single account is enough to exercise the app in all your environments.
        </p>
        <form method="post" class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button button--primary">Sign up</button>
        </form>
        <p class="form-footer">
            Already registered?
            <a href="{% url 'login' %}" class="link-inline">Go to login</a>
        </p>
    </div>
</section>
{% endblock %}
