apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: expense-db
  namespace: expense
spec:
  serviceName: expense-db
  replicas: 1
  selector:
    matchLabels: { app: expense-db }
  template:
    metadata:
      labels: { app: expense-db }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:15
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: expense }
            - { name: POSTGRES_USER, value: expense }
            - { name: POSTGRES_PASSWORD, value: expense123 }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates: []
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # bind the existing PVC
  volumeClaimTemplates: []
