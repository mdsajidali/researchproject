apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: edge-demo
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"          # <── added
            - "--storage.tsdb.retention.time=6h"          # <── tighter for 4GB VM
          ports: [{ containerPort: 9090, name: http }]
          volumeMounts:
            - name: cfg
              mountPath: /etc/prometheus
            - name: data                                  # <── added
              mountPath: /prometheus
          resources:
            requests: { cpu: "100m", memory: "128Mi" }    # <── lighter
            limits:   { cpu: "300m", memory: "256Mi" }    # <── lighter
      volumes:
        - name: cfg
          configMap: { name: prometheus-config }
        - name: data                                      # <── added
          emptyDir: {}

