apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: edge-demo
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      hostPID: true
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - { name: rootfs, mountPath: /rootfs, readOnly: true }
            - { name: var-run, mountPath: /var/run, readOnly: true }
            - { name: sys, mountPath: /sys, readOnly: true }
            - { name: crio, mountPath: /var/lib/containers, readOnly: true }
            - { name: crio-run, mountPath: /run/containers/storage, readOnly: true }
      volumes:
        - { name: rootfs, hostPath: { path: / } }
        - { name: var-run, hostPath: { path: /var/run } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: crio, hostPath: { path: /var/lib/containers } }
        - { name: crio-run, hostPath: { path: /run/containers/storage } }
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: edge-demo
spec:
  selector:
    app: cadvisor
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP

