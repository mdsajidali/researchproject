apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: edge-demo
  labels: { grafana_dashboard: "1" }
data:
  edge-overview.json: |
    {
      "title": "Edge Demo Overview",
      "timezone": "browser",
      "panels": [
        { "type": "stat", "title": "Pods Running", "targets":[{"expr":"sum(kube_pod_status_phase{phase=\"Running\"})"}] },
        { "type": "timeseries", "title": "Node CPU (cAdvisor)", "targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{id!=\"\",image!=\"\"}[2m]))"}]},
        { "type": "timeseries", "title": "Node Memory (bytes)", "targets":[{"expr":"sum(container_memory_working_set_bytes{id!=\"\",image!=\"\"})"}]}
      ],
      "schemaVersion": 38
    }

