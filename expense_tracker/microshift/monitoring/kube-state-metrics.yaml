apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics, namespace: edge-demo }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: kube-state-metrics }
rules:
- apiGroups: [""]
  resources: ["pods","nodes","services","resourcequotas","replicationcontrollers","namespaces","endpoints"]
  verbs: ["list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","statefulsets","daemonsets","replicasets"]
  verbs: ["list","watch"]
- apiGroups: ["batch"]
  resources: ["jobs","cronjobs"]
  verbs: ["list","watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics }
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: edge-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: edge-demo
  labels: { app: kube-state-metrics }
spec:
  selector: { matchLabels: { app: kube-state-metrics } }
  replicas: 1
  template:
    metadata: { labels: { app: kube-state-metrics } }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: ksm
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
          ports: [{ name: http-metrics, containerPort: 8080 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: edge-demo
spec:
  selector: { app: kube-state-metrics }
  ports:
    - name: http
      port: 8080
      targetPort: http-metrics

