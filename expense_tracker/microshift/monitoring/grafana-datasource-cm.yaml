apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: edge-demo
  labels: { grafana_datasource: "1" }
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.edge-demo.svc.cluster.local:9090
      isDefault: true

