apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: edge-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # --- Prometheus itself (inside cluster)
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # --- Kube State Metrics (for MicroShift objects)
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.edge-demo.svc.cluster.local:8080']

      # --- cAdvisor (container metrics)
      - job_name: 'cadvisor'
        static_configs:
          - targets: ['cadvisor.edge-demo.svc.cluster.local:8080']

      # --- Blackbox Exporter (Expense Tracker HTTP probe)
      - job_name: 'blackbox'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://expense-tracker.edge-demo.svc.cluster.local/
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.edge-demo.svc.cluster.local:9115

      # --- Node Exporter (external host metrics via IP)
      #- job_name: 'node_exporter'
      # static_configs:
      #   - targets: ['192.168.74.130:9100']

      # --- MicroShift Prometheus via NodePort (external validation)
      - job_name: 'microshift-prometheus'
        static_configs:
          - targets: ['192.168.74.130:30187']

      # --- MicroShift Grafana via NodePort (external validation)
      - job_name: 'microshift-grafana'
        static_configs:
          - targets: ['192.168.74.130:31398']

      # --- Expense Tracker App (via NodePort)
      - job_name: 'expense-tracker-app'
        metrics_path: /
        static_configs:
          - targets: ['192.168.74.130:31883']

