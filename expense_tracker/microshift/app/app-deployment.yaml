apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
  namespace: edge-demo
  labels:
    app: expense-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      initContainers:
        - name: collectstatic
          image: "${APP_IMAGE}"
          command: ["sh", "-c", "python manage.py collectstatic --noinput || true"]
          envFrom:
            - configMapRef:
                name: expense-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: static
              mountPath: /app/staticfiles

      containers:
        - name: web
          image: "${APP_IMAGE}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: expense-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: static
              mountPath: /app/staticfiles
      volumes:
        - name: static
          emptyDir: {}

